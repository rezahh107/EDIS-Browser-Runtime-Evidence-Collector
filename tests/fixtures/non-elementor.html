<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width" />
    <title>Normal Page Fixture</title>
    <style>
      main {
        max-width: 60rem;
        margin: auto;
        padding: 2rem;
      }
      .cards {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 1rem;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Normal page</h1>
      <div class="cards">
        <article>
          <h2>One</h2>
          <p>Evidence only.</p>
        </article>
        <article>
          <h2>Two</h2>
          <button>Button</button>
        </article>
        <article>
          <h2>Three</h2>
          <img alt="fixture" width="60" height="40" />
        </article>
      </div>
    </main>
    <script>
      document.documentElement.dataset.edisReady = "true";
    </script>
  </body>
</html>
