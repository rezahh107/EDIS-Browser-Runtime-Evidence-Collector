name: CI

on:
  push:
  pull_request:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm run release:gate:no-browser
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: no-browser-release-evidence
          path: |
            artifacts/release-gate/
            artifacts/reproducibility/
            artifacts/packages/
            artifacts/release-provenance/
          if-no-files-found: error

  e2e-smoke:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build:chrome
      - run: xvfb-run --auto-servernum npm run test:e2e:smoke
        env:
          EDIS_E2E_HEADLESS: "false"
          EDIS_E2E_CAPTURE_MEDIA: "true"
          EDIS_E2E_ARTIFACT_DIR: artifacts/browser-e2e-smoke
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: chromium-export-fallback-smoke-evidence
          path: artifacts/browser-e2e-smoke/
          if-no-files-found: error

  e2e-nightly:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: xvfb-run --auto-servernum npm run release:gate:chrome
        env:
          EDIS_E2E_HEADLESS: "false"
      - run: npm run release:evidence
        if: always()
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: automated-chromium-browser-release-evidence
          path: |
            artifacts/browser-e2e/
            artifacts/release-gate/
            artifacts/release-evidence/
            artifacts/reproducibility/
            artifacts/packages/
            artifacts/release-provenance/
          if-no-files-found: warn
