name: CI

on:
  push:
  pull_request:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
          cache: npm
      - name: Preserve canonical npm lockfile
        run: cp package-lock.json "$RUNNER_TEMP/package-lock.canonical.json"
      - name: Normalize npm lockfile registry URLs for installation
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const lockPath = 'package-lock.json';
          let lock = fs.readFileSync(lockPath, 'utf8');
          lock = lock.replaceAll(
            'https://packages.applied-caas-gateway1.internal.api.openai.org/artifactory/api/npm/npm-public/',
            'https://registry.npmjs.org/'
          );
          if (lock.includes('packages.applied-caas-gateway1.internal.api.openai.org')) {
            throw new Error('package-lock.json still contains an internal registry URL.');
          }
          fs.writeFileSync(lockPath, lock);
          NODE
      - run: npm ci --registry=https://registry.npmjs.org/
      - name: Restore canonical npm lockfile
        run: |
          cp "$RUNNER_TEMP/package-lock.canonical.json" package-lock.json
          git diff --exit-code -- package-lock.json
      - run: npm run release:gate:no-browser
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: no-browser-release-evidence
          path: |
            artifacts/release-gate/
            artifacts/reproducibility/
            artifacts/packages/
            artifacts/release-provenance/
          if-no-files-found: error

  e2e-smoke:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
          cache: npm
      - name: Preserve canonical npm lockfile
        run: cp package-lock.json "$RUNNER_TEMP/package-lock.canonical.json"
      - name: Normalize npm lockfile registry URLs for installation
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const lockPath = 'package-lock.json';
          let lock = fs.readFileSync(lockPath, 'utf8');
          lock = lock.replaceAll(
            'https://packages.applied-caas-gateway1.internal.api.openai.org/artifactory/api/npm/npm-public/',
            'https://registry.npmjs.org/'
          );
          if (lock.includes('packages.applied-caas-gateway1.internal.api.openai.org')) {
            throw new Error('package-lock.json still contains an internal registry URL.');
          }
          fs.writeFileSync(lockPath, lock);
          NODE
      - run: npm ci --registry=https://registry.npmjs.org/
      - name: Restore canonical npm lockfile
        run: |
          cp "$RUNNER_TEMP/package-lock.canonical.json" package-lock.json
          git diff --exit-code -- package-lock.json
      - run: npx playwright install --with-deps chromium
      - run: npm run build:chrome
      - name: Package exact Chrome release artifact
        run: node scripts/package-release.mjs --target chrome
      - name: Verify exact Chrome release artifact
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const metadata = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const target = `artifacts/packages/edis-runtime-collector-chrome-${metadata.version}.zip`;
          const stat = fs.statSync(target);
          if (!stat.isFile() || stat.size === 0) {
            throw new Error(`Exact Chrome package is missing or empty: ${target}`);
          }
          console.log(`Verified exact Chrome package: ${target} (${stat.size} bytes)`);
          NODE
      - run: xvfb-run --auto-servernum npm run test:e2e:smoke
        env:
          EDIS_E2E_HEADLESS: "false"
          EDIS_E2E_CAPTURE_MEDIA: "true"
          EDIS_E2E_ARTIFACT_DIR: artifacts/browser-e2e-smoke
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: chromium-export-fallback-smoke-evidence
          path: artifacts/browser-e2e-smoke/
          if-no-files-found: error

  e2e-nightly:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
          cache: npm
      - name: Preserve canonical npm lockfile
        run: cp package-lock.json "$RUNNER_TEMP/package-lock.canonical.json"
      - name: Normalize npm lockfile registry URLs for installation
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const lockPath = 'package-lock.json';
          let lock = fs.readFileSync(lockPath, 'utf8');
          lock = lock.replaceAll(
            'https://packages.applied-caas-gateway1.internal.api.openai.org/artifactory/api/npm/npm-public/',
            'https://registry.npmjs.org/'
          );
          if (lock.includes('packages.applied-caas-gateway1.internal.api.openai.org')) {
            throw new Error('package-lock.json still contains an internal registry URL.');
          }
          fs.writeFileSync(lockPath, lock);
          NODE
      - run: npm ci --registry=https://registry.npmjs.org/
      - name: Restore canonical npm lockfile
        run: |
          cp "$RUNNER_TEMP/package-lock.canonical.json" package-lock.json
          git diff --exit-code -- package-lock.json
      - run: npx playwright install --with-deps chromium
      - run: xvfb-run --auto-servernum npm run release:gate:chrome
        env:
          EDIS_E2E_HEADLESS: "false"
      - run: npm run release:evidence
        if: always()
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: automated-chromium-browser-release-evidence
          path: |
            artifacts/browser-e2e/
            artifacts/release-gate/
            artifacts/release-evidence/
            artifacts/reproducibility/
            artifacts/packages/
            artifacts/release-provenance/
          if-no-files-found: warn
