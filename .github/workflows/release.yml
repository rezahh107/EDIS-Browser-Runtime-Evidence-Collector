name: Release validation

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release-artifacts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: xvfb-run --auto-servernum npm run release:gate:chrome
        env:
          EDIS_E2E_HEADLESS: "false"
      - run: npm run release:evidence
        if: always()
      - name: Verify full browser gate before packaging
        run: node -e "const r=require('./artifacts/release-gate/command-results.json'); if(r.exitCode!==0) process.exit(1)"
      - run: npm run package:release:verified
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: unsigned-review-artifacts
          path: |
            artifacts/packages/*.zip
            artifacts/release-evidence/*
            artifacts/browser-e2e/*
            artifacts/reproducibility/*
            artifacts/release-provenance/*
          if-no-files-found: error
