name: Release validation

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release-artifacts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chrome msedge
      - run: xvfb-run --auto-servernum npm run release:gate:all
        env:
          EDIS_E2E_HEADLESS: "false"
      - run: npm run release:evidence
        if: always()
      - name: Verify full browser gate before packaging
        run: |
          node --input-type=module <<'NODE'
          import { readFile } from "node:fs/promises";
          const gate = JSON.parse(await readFile("artifacts/release-gate/command-results.json", "utf8"));
          const full = JSON.parse(await readFile("artifacts/release-gate/full-release-qualification.json", "utf8"));
          if (
            gate.exitCode !== 0 ||
            gate.mode !== "FULL_TWO_TARGET" ||
            gate.browser?.qualificationScope !== "FULL_TWO_TARGET_RELEASE_GATE" ||
            gate.full_release_gate_passed !== true ||
            full.full_release_gate_passed !== true ||
            full.exact_chrome_qualified !== true ||
            full.exact_edge_qualified !== true
          ) process.exit(1);
          NODE
      - run: npm run package:release:verified
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unsigned-review-artifacts
          path: |
            artifacts/packages/*.zip
            artifacts/release-evidence/*
            artifacts/browser-e2e/*
            artifacts/release-gate/*
            artifacts/reproducibility/*
            artifacts/release-provenance/*
          if-no-files-found: error
